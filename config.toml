# Job Hunter settings. Edit this file to change what it looks for.
#
# Goal: PAID SUMMER INTERNSHIPS (fits the uni calendar) in IT / cyber security,
# in London. No permanent jobs, nothing asking for experience or
# qualifications that aren't on my CV.

[search]
location = "London"
radius_miles = 8
# Searches run against Reed (one call per term)
search_terms = [
  "cyber security internship",
  "IT internship",
  "technology internship",
  "summer internship",
  "security internship",
  "technology summer placement",
  "IT support intern",
  "SOC intern",
]
# Adzuna's free plan allows 250 calls/day, 1,000/week, 2,500/month.
# 6 terms x 9 runs a day = 54/day, ~380/week, ~1,650/month - safely under.
adzuna_terms = [
  "cyber security internship",
  "IT internship",
  "technology internship",
  "summer internship",
  "security intern",
  "technology placement",
]
# Internships stay open for weeks, so look back further than for normal jobs.
# You still only get one alert per advert.
max_age_hours = 1440   # 60 days
min_salary = 0         # internships are often listed pro-rata or "competitive"
# Reed shows how many people applied. Skip very crowded adverts.
max_applicants = 150

[filters]
# The TITLE must say it's an internship / summer programme
title_must_include = ["intern", "internship", "summer", "insight"]
# ...the TITLE must also name an IT / cyber field
title_field_must_include = [
  "cyber", "security", "infosec", "soc", "grc", "it", "information technology",
  "technology", "tech", "infrastructure", "network", "service desk", "helpdesk",
  "cloud", "digital",
]
# ...and the title or advert must be about IT / tech / cyber
field_must_include = [
  "cyber", "security", "it support", "it intern", "it summer", "it placement",
  "information technology", "technology",
  "tech", "infrastructure", "network", "soc", "digital", "service desk", "helpdesk",
  "cloud", "systems",
]
# Skip titles containing any of these (wrong level, wrong field, not summer)
title_exclude = [
  "senior", "lead", "principal", "head of", "manager", "director", "architect",
  "consultant", "specialist", "permanent", "graduate scheme", "graduate programme",
  "year in industry", "industrial placement", "12 month", "12-month", "sandwich",
  "marketing", "sales", "finance", "accounting", "audit", "tax", "legal", "law",
  "hr", "human resources", "people", "recruitment", "design", "actuarial",
  "investment banking", "trading", "markets", "japanese", "german", "french",
  "mandarin", "phd", "masters", "msc",
  "investment", "investor", "treasury", "banking", "consulting", "research",
  "software", "developer", "data science", "machine learning", "quant",
  "account representative", "operations engineering", "analyst, software",
]
# Contract types to reject (Reed/Adzuna report these)
reject_contract_types = ["permanent"]
# Advert text that means it doesn't suit you - checked on the FULL advert
reject_phrases = [
  "proven experience", "previous experience in", "commercial experience",
  "industry experience", "prior experience in", "experience working in a",
  "sc clearance", "dv clearance", "security clearance", "eligible for sc",
  "unpaid", "voluntary role", "expenses only",
  "year in industry", "12-month placement", "12 month placement", "12 months",
  "1 year - full-time", "one year internship", "1-year internship",
  "industrial placement", "sandwich",
  "final year students", "final-year students",
]
# Qualifications that aren't on your CV: reject if the advert says they're
# required (mentioned near "required", "essential" or "must")
certs_not_held = [
  "cissp", "cism", "cisa", "ccna", "ccnp", "oscp", "ceh", "sc-200", "sc-900",
  "az-900", "az-500", "ms-900", "itil", "a+", "network+", "cysa+", "pentest+",
]
# You graduate in 2028 - reject internships for other graduation years
graduation_year = 2028
# Recruiters selling paid training courses disguised as jobs - always skip
company_exclude = [
  "newto training", "netcom", "itol recruit", "career change", "training",
  "academy", "itonlinelearning", "learning",
]
max_years_experience = 1

[notify]
# Free push notifications to your phone via the ntfy app (topic = NTFY_TOPIC secret)
min_score_to_alert = 50
# Jobs at or above this score AND under 12h old get an urgent alert
urgent_score = 70

# Company career boards checked directly (posted by the employer).
# Add more: find the company's "boards.greenhouse.io/<slug>",
# "jobs.lever.co/<slug>" or "jobs.ashbyhq.com/<slug>" link and add the slug.
[companies]
greenhouse = ["monzo", "cloudflare", "gocardless", "deliveroo", "datadog", "elastic", "truelayer", "wizinc"]
lever = ["palantir"]
ashby = ["snyk", "synthesia"]
