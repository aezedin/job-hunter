name: Job Radar alerts

# The Claude "Job Radar scan" saves each run's new internships to
# data/radar_queue/. This sends them to your phone through ntfy straight away.
on:
  push:
    branches: [main]
    paths: ["data/radar_queue/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: hunt

jobs:
  relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send Job Radar finds to phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m jobhunter relay
      - name: Clear sent alerts
        run: |
          git config user.name "job-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/radar_queue
          git diff --cached --quiet && exit 0
          git commit -m "Job Radar alerts sent $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
